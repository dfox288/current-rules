[project]
name = "fixture-pkg"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
test = ["dfox288-test-preset", "pg8000==1.31.5"]

[tool.uv.sources]
dfox288-test-preset = { path = "../../pytest" }

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
