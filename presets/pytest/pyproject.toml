[project]
name = "dfox288-test-preset"
version = "0.1.2"
description = "The pytest preset of the testing baseline: tiers as markers, limits, guards, count guard, DB helper"
requires-python = ">=3.14"
dependencies = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "pytest-socket==0.8.1",
]
classifiers = ["Framework :: Pytest"]

[project.entry-points.pytest11]
dfox288_test_preset = "dfox288_test_preset.plugin"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
